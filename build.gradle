buildscript {
    repositories {
        flatDir {
            dirs '.'
        }
    }
    dependencies {
        classpath 'com.rikonardo.papermake:papermake:1.0.6'
    }
}


plugins {
    id 'java'
    id "com.modrinth.minotaur" version "2.+"
    //id 'com.rikonardo.papermake' version '1.0.6'
}

apply plugin: 'com.rikonardo.papermake'
group = 'stranik.dev'
version = '1.1'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "spigot-snapshots";
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    repositories {
        maven { url "https://repo.dmulloy2.net/repository/public/" }
    }
}

ext {
    paperVer = findProperty('paperVer')  ?: '1.21'
    spigotVer = findProperty('spigotVer') ?: paperVer
}

sourceSets {
    // Общий код и ресурсы
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }
    // Специфично для Spigot/Bukkit
    spigot {
        java.srcDirs = ['src/spigot/java']
        resources.srcDirs = ['src/spigot/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // Специфично для Paper
    paper {
        java.srcDirs = ['src/paper/java']
        resources.srcDirs = ['src/paper/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // Отдельный источник под Bukkit (опционально). Можно оставить пустым.
    bukkit {
        java.srcDirs = ['src/bukkit/java']
        resources.srcDirs = ['src/bukkit/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    // создаются автоматически: spigotCompileOnly, paperCompileOnly, bukkitCompileOnly
}

dependencies {
    paperCompileOnly("io.papermc.paper:paper-api:${paperVer}-R0.1-SNAPSHOT")


    compileOnly 'com.comphenix.protocol:ProtocolLib:5.3.0'
    compileOnly "org.spigotmc:spigot-api:${spigotVer}-R0.1-SNAPSHOT"
    compileOnly "net.kyori:adventure-api:4.17.0"
}

// 2) Добавляем классификатор к JAR (например, plugin-1.1-1.21.3.jar)
tasks.named('jar') {
    archiveClassifier.set(paperVer)
}

gradle.taskGraph.whenReady {
    if (!modrinth.token.isPresent()) {
        throw new Exception("Modrinth token не найден. Задайте -PmodrinthToken или \$ENV:MODRINTH_TOKEN")
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = 'FNpfZcs7'
    versionName = "Compass Сoordinates v${version}"
    versionNumber = "${version}"
    versionType = "release"
    changelog = "Required ProtocolLib versions 5.3.0 or higher"
    uploadFile = tasks.jar.archiveFile.get().asFile
    gameVersions = [paperVer]
    loaders = ['paper', 'spigot', 'bukkit']
}

tasks.register('jarSpigot', Jar) {
    group = 'build'
    description = 'Собирает Spigot JAR'
    from sourceSets.main.output
    from sourceSets.spigot.output
    dependsOn tasks.named('classes'), tasks.named('compileJava'), tasks.named('processResources'), tasks.named('compileSpigotJava'), tasks.named('processSpigotResources')
    archiveClassifier.set("spigot-${spigotVer}")
}

// JAR для Bukkit (то же, что Spigot, отдельный классификатор)
tasks.register('jarBukkit', Jar) {
    group = 'build'
    description = 'Собирает Bukkit JAR'
    from sourceSets.main.output
    from sourceSets.bukkit.output
    from sourceSets.spigot.output
    dependsOn tasks.named('classes'), tasks.named('compileJava'), tasks.named('processResources'), tasks.named('compileBukkitJava'), tasks.named('processBukkitResources'), tasks.named('compileSpigotJava')
    archiveClassifier.set("bukkit-${spigotVer}")
}

tasks.register('jarPaper', Jar) {
    group = 'build'
    description = 'Собирает Paper JAR'
    from sourceSets.main.output
    from sourceSets.paper.output
    dependsOn tasks.named('classes'), tasks.named('compileJava'), tasks.named('processResources'), tasks.named('compilePaperJava'), tasks.named('processPaperResources')
    archiveClassifier.set("paper-${paperVer}")
}

// Сборка всех вариантов
tasks.register('buildAllOneVer') {
    group = 'build'
    description = 'Собирает Bukkit, Spigot и Paper JAR'
    // dependsOn 'jarBukkit', 'jarSpigot', 'jarPaper'
    dependsOn 'modrinthUploadSpigot', 'modrinthUploadBukkit', 'modrinthUploadPaper'
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def gradlew = isWindows ? 'gradlew.bat' : './gradlew'

tasks.register('uploadAllOneVer') {
    group = 'upload'
    description = 'Загружает Bukkit, Spigot и Paper JAR'
    // dependsOn 'jarBukkit', 'jarSpigot', 'jarPaper'

    doLast {
        println "==> Uploading Spigot version"
        exec {
            workingDir rootDir
            commandLine gradlew, 'modrinthUploadSpigot', "-PpaperVer=${paperVer}", "-PspigotVer=${spigotVer}"
            standardOutput = System.out
            errorOutput = System.err
        }

        println "==> Uploading Bukkit version"
        exec {
            workingDir rootDir
            commandLine gradlew, 'modrinthUploadBukkit', "-PpaperVer=${paperVer}", "-PspigotVer=${spigotVer}"
            standardOutput = System.out
            errorOutput = System.err
        }

        println "==> Uploading Paper version"
        exec {
            workingDir rootDir
            commandLine gradlew, 'modrinthUploadPaper', "-PpaperVer=${paperVer}", "-PspigotVer=${spigotVer}"
            standardOutput = System.out
            errorOutput = System.err
        }
    }
}

// Матричная сборка по версиям из paperMatrix
tasks.register('buildAll') {
    group = 'build'
    description = 'Собирает JAR под все версии из paperMatrix'

    doLast {
        def versions = (findProperty('paperMatrix') ?: '')
                .toString()
                .split(',')
                .collect { it.trim() }
                .findAll { !it.isEmpty() }

        if (versions.isEmpty()) {
            throw new Exception("Добавьте paperMatrix в gradle.properties, например: paperMatrix=1.21,1.21.1,...,1.21.8")
        }

        versions.each { ver ->
            println "==> Build for Paper ${ver}"
            def result = exec {
                workingDir rootDir
                commandLine gradlew, 'buildAllOneVer', "-PpaperVer=${ver}", "-PspigotVer=${ver}"
                standardOutput = System.out
                errorOutput = System.err
            }
        }
    }
}

tasks.register('uploadAll') {
    group = 'upload'
    description = 'Собирает JAR под все версии из paperMatrix'

    doLast {
        def versions = (findProperty('paperMatrix') ?: '')
                .toString()
                .split(',')
                .collect { it.trim() }
                .findAll { !it.isEmpty() }

        if (versions.isEmpty()) {
            throw new Exception("Добавьте paperMatrix в gradle.properties, например: paperMatrix=1.21,1.21.1,...,1.21.8")
        }

        versions.each { ver ->
            println "==> Upload for Paper ${ver}"
            def result = exec {
                workingDir rootDir
                commandLine gradlew, 'uploadAllOneVer', "-PpaperVer=${ver}", "-PspigotVer=${ver}"
                standardOutput = System.out
                errorOutput = System.err
            }
        }
    }
}


def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// groovy
tasks.register('modrinthUploadSpigot') {
    group = 'upload'
    description = 'Загружает Spigot JAR на Modrinth'
    dependsOn tasks.named('jarSpigot')

    doFirst {
        modrinth.uploadFile = tasks.named('jarSpigot', Jar).flatMap { it.archiveFile }
        modrinth.loaders = ['spigot']
        modrinth.gameVersions = [spigotVer]
    }

    finalizedBy tasks.named('modrinth')
}

tasks.register('modrinthUploadBukkit') {
    group = 'upload'
    description = 'Загружает Bukkit JAR на Modrinth'
    dependsOn tasks.named('jarBukkit')
    doFirst {
        modrinth.uploadFile = tasks.named('jarBukkit', Jar).flatMap { it.archiveFile }
        modrinth.loaders = ['bukkit']
        modrinth.gameVersions = [spigotVer]
    }

    finalizedBy tasks.named('modrinth')
}

tasks.register('modrinthUploadPaper') {
    group = 'upload'
    description = 'Загружает Paper JAR на Modrinth'
    dependsOn tasks.named('jarPaper')

    doFirst {
        modrinth.uploadFile = tasks.named('jarPaper', Jar).flatMap { it.archiveFile }
        modrinth.loaders = ['paper']
        modrinth.gameVersions = [paperVer]
    }

    finalizedBy tasks.named('modrinth')
}
